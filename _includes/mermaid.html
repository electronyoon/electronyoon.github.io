<script>
(function() {
  const hasMermaid = document.querySelector('code.language-mermaid, pre > code.language-mermaid');
  if (!hasMermaid) return;

  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  script.onload = function() {
    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    document.querySelectorAll('pre > code.language-mermaid').forEach(function(code) {
      const pre = code.parentElement;
      const div = document.createElement('div');
      div.className = 'mermaid';
      div.textContent = code.textContent;
      pre.replaceWith(div);
    });

    mermaid.run().then(function() {
      // 모바일에서 원래 크기로 그린 뒤 가로 스크롤할 수 있도록,
      // mermaid가 SVG에 남긴 자연 폭을 CSS 변수로 노출한다.
      document.querySelectorAll('div.mermaid').forEach(function(div) {
        const svg = div.querySelector('svg');
        if (!svg) return;
        let w = svg.style.maxWidth;
        if (!w && svg.viewBox && svg.viewBox.baseVal) {
          w = svg.viewBox.baseVal.width + 'px';
        }
        if (w) div.style.setProperty('--mermaid-natural-width', w);
      });
    });
  };
  document.head.appendChild(script);
})();
</script>
