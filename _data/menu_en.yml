# English home menu. Mirrors _data/menu.yml in structure; labels in English,
# post lists auto-filter to lang: en (see _includes/post_list.html).
# Empty sections stay visible, matching the theme's default menu behavior.

entries:
  - title: info
    entries:
      - title: A blog by Sangwoo Kim, a backend developer.
      - title: linkedin
        url: https://www.linkedin.com/in/electronyoon
      - title: github
        url: https://github.com/electronyoon

  - title: 'posts in the "Speed" series'
    post_list:
      series: 속도개선

  - title: 'posts in category "work"'
    post_list:
      limit: 10
      category: work

  - title: 'posts in category "tech"'
    post_list:
      limit: 10
      category: tech

  - title: 'posts in category "reviews"'
    post_list:
      limit: 10
      category: reviews

  - title: 'posts in category "thoughts"'
    post_list:
      limit: 10
      category: thoughts
